name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No provider credentials exist in CI. Paid providers are also switched off, and any
# outbound provider request fails the run instead of being silently handled.
env:
  PIXEL_PAID_PROVIDERS_ENABLED: "false"
  PIXEL_BLOCK_EXTERNAL_HTTP: "true"
  PIXEL_IGNORE_ENV_FILES: "true"
  LLM_ENABLED: "false"
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install API dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --requirement apps/api/requirements.lock
      - name: Run API tests
        run: npm run test:api
      - name: Build API deployment image
        run: docker build --file Dockerfile.api --tag pixel-api:ci .
      - name: Smoke-test API deployment image
        run: |
          docker run --detach --name pixel-api-ci --publish 127.0.0.1:8011:8001 \
            --tmpfs /data \
            --env PIXEL_DB_PATH=/data/demo.sqlite3 \
            --env PIXEL_AUTH_SECRET=ci-only-stable-auth-secret \
            --env PIXEL_SYNTHETIC_DEMO=true \
            --env PIXEL_DEMO_SEEDS=true \
            --env PIXEL_PAID_PROVIDERS_ENABLED=false \
            --env LLM_ENABLED=false \
            pixel-api:ci
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8011/health > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs pixel-api-ci
            exit 1
          fi
          # The same checks as the live smoke test: a conversation starts and a real request is
          # answered, the guardrail refuses for its own reason, the administrator cannot sign in,
          # and a visitor cannot reset shared data. Rate limits stay armed, as in production.
          if ! PIXEL_SMOKE_API_URL=http://127.0.0.1:8011/api node scripts/smoke-live.mjs; then
            docker logs pixel-api-ci
            exit 1
          fi
          docker rm --force pixel-api-ci

  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run lint:web
      - name: Unit tests (including the provider-boundary check)
        run: npm run test:web
      - name: Console design and permission tests
        run: npm run test:console
      - name: Production build
        run: npm run build:web

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --requirement apps/api/requirements.lock
          npm ci
          npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e
      # The cutover gate (5d plan, section 2.4): the same suite and the browser golden, strictly
      # compared with their own reviewed list, with the definition engine as the authority.
      - name: Run browser tests under definition authority
        if: success() || failure()
        env:
          PIXEL_ENGINE_MODE: definition
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
